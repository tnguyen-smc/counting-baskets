/* ============================ HELPERS ============================ */
function pad2(n) { return n < 10 ? '0' + n : '' + n; }
function toDateStr(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function todayStr() { return toDateStr(new Date()); }
function parseDateStr(s) { const [y,m,d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(d, n) { const nd = new Date(d); nd.setDate(nd.getDate() + n); return nd; }
function formatDisplayDate(dateStr) {
  const d = parseDateStr(dateStr);
  return d.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
}
function formatShortDate(dateStr) {
  const d = parseDateStr(dateStr);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}
function initials(name) {
  return name.split(' ').map(p => p[0]).join('').slice(0,2).toUpperCase();
}
function colorForName(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
}
function uid(prefix) { return prefix + '_' + Math.random().toString(36).slice(2,9); }

// Deterministic seeded pseudo-random generator based on a string seed
function seededRandom(seedStr) {
  let h = 0;
  for (let i = 0; i < seedStr.length; i++) { h = Math.imul(31, h) + seedStr.charCodeAt(i) | 0; }
  h = Math.abs(h);
  return (h % 10000) / 10000;
}

function isWeekday(d) { const day = d.getDay(); return day !== 0 && day !== 6; }

/* ============================ MOCK HISTORY GENERATION ============================ */
function generateHistoricalLogs(classrooms, students) {
  const logs = {};
  const today = new Date();
  const daysBack = 75; // roughly one semester's worth of school data
  for (let i = daysBack; i >= 1; i--) {
    const d = addDays(today, -i);
    if (!isWeekday(d)) continue;
    const dateStr = toDateStr(d);
    logs[dateStr] = {};
    classrooms.forEach(cls => {
      const roster = students.filter(s => s.classroomId === cls.id);
      const entries = {};
      roster.forEach((s, idx) => {
        const seed = dateStr + '-' + s.id;
        const r1 = seededRandom(seed + '-portion');
        const r2 = seededRandom(seed + '-milk');
        const fullPortion = r1 < 0.87;
        let milk = 'none';
        if (r2 < 0.42) milk = 'white';
        else if (r2 < 0.80) milk = 'chocolate';
        else milk = 'none';
        entries[s.id] = { fullPortion, milk };
      });
      // Occasionally a classroom log is missing (teacher forgot) to make data realistic
      const skip = seededRandom(dateStr + '-' + cls.id + '-skip') < 0.04;
      if (!skip) {
        logs[dateStr][cls.id] = {
          submitted: true,
          submittedAt: new Date(d.getFullYear(), d.getMonth(), d.getDate(), 11, 45).toISOString(),
          entries
        };
      }
    });
  }
  return logs;
}

function loadInitialData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.classrooms && parsed.students && parsed.logs) return parsed;
    }
  } catch (e) { console.warn('Failed to load saved data, resetting.', e); }
  const data = {
    classrooms: INITIAL_CLASSROOMS,
    students: INITIAL_STUDENTS,
    logs: generateHistoricalLogs(INITIAL_CLASSROOMS, INITIAL_STUDENTS)
  };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  return data;
}

function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

/* ============================ TEACHER: OVERVIEW ============================ */
function computeStatus(logs, dateStr, classroomId) {
  const log = logs[dateStr] && logs[dateStr][classroomId];
  if (!log) return 'Not Started';
  return log.submitted ? 'Completed' : 'In Progress';
}

function TeacherOverview({ data, onOpenClassroom }) {

      </div>
      <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">
        {data.classrooms.map(cls => {
          const roster = data.students.filter(s => s.classroomId === cls.id);
          const status = computeStatus(data.logs, today, cls.id);
          return (
            <button
              key={cls.id}
              onClick={() => onOpenClassroom(cls.id)}
              className="text-left bg-white rounded-2xl card-shadow hover:card-shadow-lg transition-fast p-6 border border-primary-100 hover:border-primary-300 btn-touch"
            >
              <div className="flex justify-between items-start mb-3">
                <div>
                  <h3 className="text-xl font-bold text-primary-900">{cls.name}</h3>
                  <p className="text-sm font-medium text-primary-500">{cls.grade} &middot; {cls.teacher}</p>
                </div>
                <Badge status={status} />

            </button>
          );
        })}
      </div>
    </div>
  );
}

/* ============================ TEACHER: ROSTER ============================ */
function ensureTodayLog(data, classroomId, dateStr) {
  const roster = data.students.filter(s => s.classroomId === classroomId);
  const existing = data.logs[dateStr] && data.logs[dateStr][classroomId];
  if (existing) return existing;
  const entries = {};
  roster.forEach(s => { entries[s.id] = { fullPortion: true, milk: 'none' }; });
  return { submitted: false, submittedAt: null, entries };
}

function StudentRosterCard({ student, entry, onChange }) {

      <div className="flex items-center gap-3">
        <Avatar name={student.name} size={52} />
        <div className="min-w-0">
          <p className="font-semibold text-primary-900 truncate">{student.name}</p>
        </div>
      </div>
      <div>
        <p className="text-xs font-medium text-primary-500 mb-1 uppercase tracking-wide">Full Portion Received</p>
        <div className="flex gap-2">
          <button

              className={"flex-1 btn-touch rounded-xl font-semibold text-xs transition-fast border-2 " + (entry.milk === val ? 'bg-primary text-white border-primary' : 'bg-white text-primary-700 border-primary-200 hover:bg-primary-50')}
            >{label}</button>
          ))}
        </div>

}

function ClassroomRoster({ data, classroomId, onBack, onReview, persist }) {
  const today = todayStr();
  const cls = data.classrooms.find(c => c.id === classroomId);
  const roster = data.students.filter(s => s.classroomId === classroomId);
  const log = ensureTodayLog(data, classroomId, today);

  // persist a draft immediately so state survives reloads
  useEffect(() => {
    if (!(data.logs[today] && data.logs[today][classroomId])) {
      const newLogs = { ...data.logs, [today]: { ...(data.logs[today] || {}), [classroomId]: log } };
      persist({ ...data, logs: newLogs });
    }
    // eslint-disable-next-line
  }, []);

  function updateEntry(studentId, newEntry) {
    const currentLog = (data.logs[today] && data.logs[today][classroomId]) || log;
    const newLog = { ...currentLog, entries: { ...currentLog.entries, [studentId]: newEntry } };
    const newLogs = { ...data.logs, [today]: { ...(data.logs[today] || {}), [classroomId]: newLog } };
    persist({ ...data, logs: newLogs });
  }

  const currentEntries = (data.logs[today] && data.logs[today][classroomId] && data.logs[today][classroomId].entries) || log.entries;
  const isSubmitted = data.logs[today] && data.logs[today][classroomId] && data.logs[today][classroomId].submitted;

  return (
    <div className="max-w-6xl mx-auto px-4 sm:px-6 py-8">
      <div className="flex items-center justify-between mb-6 flex-wrap gap-3">
        <div>
          <button onClick={onBack} className="text-primary font-semibold text-sm mb-2 hover:underline">&larr; Back to Overview</button>
          <h2 className="text-2xl font-bold text-primary-900">{cls.name} <span className="font-light text-primary-500 text-lg">&middot; {cls.grade}</span></h2>
          <p className="text-primary-600 font-light">{cls.teacher}</p>
        </div>
        {isSubmitted && <Badge status="Completed" />}
      </div>

      {isSubmitted && (
        <div className="mb-6 bg-amber-50 border border-amber-300 text-amber-800 rounded-xl p-4 text-sm font-medium">
          This classroom was already submitted for today. You can still make corrections below and re-submit.
        </div>
      )}

      <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-8">
        {roster.map(s => (
          <StudentRosterCard
            key={s.id}
            student={s}
            entry={currentEntries[s.id] || { fullPortion: true, milk: 'none' }}
            onChange={(e) => updateEntry(s.id, e)}
          />
        ))}
      </div>

      <div className="sticky bottom-0 bg-secondary/95 backdrop-blur pt-4 pb-2 border-t border-primary-100">
        <div className="flex justify-end gap-3">
          <GhostButton onClick={onBack}>Cancel</GhostButton>
          <PrimaryButton onClick={() => onReview(classroomId)}>Review Submission &rarr;</PrimaryButton>
        </div>
      </div>
    </div>
  );
}

/* ============================ TEACHER: REVIEW ============================ */
function ReviewScreen({ data, classroomId, onEdit, onSubmit }) {
  const today = todayStr();
  const cls = data.classrooms.find(c => c.id === classroomId);
  const roster = data.students.filter(s => s.classroomId === classroomId);
  const log = data.logs[today][classroomId];
  const entries = log.entries;

  const totals = useMemo(() => {
    let full = 0, white = 0, choc = 0;
    roster.forEach(s => {
      const e = entries[s.id];
      if (e.fullPortion) full++;
      if (e.milk === 'white') white++;
      if (e.milk === 'chocolate') choc++;
    });
    return { full, white, choc };
  }, [entries, roster]);

  function handleSubmit() {
    const newLog = { ...log, submitted: true, submittedAt: new Date().toISOString() };
    const newLogs = { ...data.logs, [today]: { ...data.logs[today], [classroomId]: newLog } };
    onSubmit({ ...data, logs: newLogs });
  }

  return (
    <div className="max-w-4xl mx-auto px-4 sm:px-6 py-8">
      <button onClick={() => onEdit(classroomId)} className="text-primary font-semibold text-sm mb-4 hover:underline">&larr; Edit / Go Back</button>
      <h2 className="text-2xl font-bold text-primary-900 mb-1">Review Submission</h2>
      <p className="text-primary-600 font-light mb-6">{cls.name} &middot; {cls.grade} &middot; {formatDisplayDate(today)}</p>

      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-8">
        <div className="bg-white rounded-2xl card-shadow p-4 text-center border border-primary-100">
          <p className="text-3xl font-bold text-primary">{roster.length}</p>
          <p className="text-xs font-medium text-primary-500 uppercase mt-1">Students</p>
        </div>
        <div className="bg-white rounded-2xl card-shadow p-4 text-center border border-primary-100">
          <p className="text-3xl font-bold text-primary">{totals.full}</p>
          <p className="text-xs font-medium text-primary-500 uppercase mt-1">Full Portions</p>
        </div>
        <div className="bg-white rounded-2xl card-shadow p-4 text-center border border-primary-100">
          <p className="text-3xl font-bold text-primary">{totals.white}</p>
          <p className="text-xs font-medium text-primary-500 uppercase mt-1">White Milk</p>
        </div>
        <div className="bg-white rounded-2xl card-shadow p-4 text-center border border-primary-100">
          <p className="text-3xl font-bold text-primary">{totals.choc}</p>
          <p className="text-xs font-medium text-primary-500 uppercase mt-1">Chocolate Milk</p>
        </div>
      </div>

      <div className="bg-white rounded-2xl card-shadow border border-primary-100 divide-y divide-primary-50 mb-8 overflow-hidden">
        {roster.map(s => {
          const e = entries[s.id];
          return (
            <div key={s.id} className="flex items-center gap-3 p-4">
              <Avatar name={s.name} size={40} />
              <p className="font-medium text-primary-900 flex-1 truncate">{s.name}</p>
              <span className={"text-xs font-semibold px-2 py-1 rounded-full " + (e.fullPortion ? 'bg-green-100 text-green-700' : 'bg-rose-100 text-rose-700')}>
                {e.fullPortion ? 'Full Portion' : 'Not Full'}
              </span>
              <span className="text-xs font-semibold px-2 py-1 rounded-full bg-primary-50 text-primary-700 capitalize">
                {e.milk === 'none' ? 'No Milk' : e.milk + ' Milk'}
              </span>
            </div>
          );
        })}
      </div>

      <div className="flex justify-end gap-3">
        <GhostButton onClick={() => onEdit(classroomId)}>Edit / Go Back</GhostButton>
        <PrimaryButton onClick={handleSubmit}>Save &amp; Submit</PrimaryButton>
      </div>
    </div>
  );
}

/* ============================ ADMIN: STUDENT MANAGEMENT ============================ */
function StudentManagement({ data, persist }) {
  const [newName, setNewName] = useState('');
  const [newClass, setNewClass] = useState(data.classrooms[0] ? data.classrooms[0].id : '');
  const [editingId, setEditingId] = useState(null);
  const [editName, setEditName] = useState('');

  function addStudent(e) {
    e.preventDefault();
    if (!newName.trim() || !newClass) return;
    const student = { id: uid('s'), name: newName.trim(), classroomId: newClass };
    persist({ ...data, students: [...data.students, student] });
    setNewName('');
  }

  function deleteStudent(id) {
    if (!confirm('Remove this student? This cannot be undone.')) return;
    persist({ ...data, students: data.students.filter(s => s.id !== id) });

  function moveStudent(id, classroomId) {

/* ============================ ADMIN: ANALYTICS ============================ */
function getSemesterRange(dateStr) {
  const d = parseDateStr(dateStr);
  const y = d.getFullYear();
  // Fall: Aug 1 - Dec 31 ; Spring: Jan 1 - Jun 15
  if (d.getMonth() >= 7) return { start: new Date(y, 7, 1), end: new Date(y, 11, 31), label: 'Fall ' + y };
  return { start: new Date(y, 0, 1), end: new Date(y, 5, 15), label: 'Spring ' + y };
}
function getWeekRange(dateStr) {
  const d = parseDateStr(dateStr);
  const day = d.getDay();
  const diffToMonday = (day === 0 ? -6 : 1) - day;
  const monday = addDays(d, diffToMonday);
  const friday = addDays(monday, 4);
  return { start: monday, end: friday };
}
function getMonthRange(monthStr) {
  const [y, m] = monthStr.split('-').map(Number);
  return { start: new Date(y, m - 1, 1), end: new Date(y, m, 0) };
}

function aggregate(data, startDate, endDate) {
  const result = {};
  data.classrooms.forEach(c => { result[c.id] = { fullPortion: 0, white: 0, choc: 0, entryCount: 0, daysLogged: 0 }; });
  Object.keys(data.logs).forEach(dateStr => {
    const d = parseDateStr(dateStr);
    if (d < startDate || d > endDate) return;
    const dayLog = data.logs[dateStr];
    Object.keys(dayLog).forEach(classroomId => {
      const entryLog = dayLog[classroomId];
      if (!entryLog || !entryLog.submitted || !result[classroomId]) return;
      result[classroomId].daysLogged++;
      Object.values(entryLog.entries).forEach(e => {
        result[classroomId].entryCount++;
        if (e.fullPortion) result[classroomId].fullPortion++;
        if (e.milk === 'white') result[classroomId].white++;
        if (e.milk === 'chocolate') result[classroomId].choc++;
      });
    });
  });
  return result;
}

function BarRow({ label, value, max, color }) {
  const pct = max > 0 ? Math.round((value / max) * 100) : 0;
  return (
    <div className="mb-3">
      <div className="flex justify-between text-sm font-medium text-primary-700 mb-1">
        <span>{label}</span><span className="font-bold">{value}</span>
      </div>
      <div className="w-full bg-primary-50 rounded-full h-3 overflow-hidden">
        <div className="h-3 rounded-full transition-fast" style={{ width: pct + '%', backgroundColor: color }}></div>
      </div>
    </div>
  );
}

function ExportPanel({ data }) {
  const [dateVal, setDateVal] = useState(todayStr());

  const rows = useMemo(() => {
    return data.classrooms.map(c => {
      const roster = data.students.filter(s => s.classroomId === c.id);
      const log = data.logs[dateVal] && data.logs[dateVal][c.id];
      if (!log || !log.submitted) {
        return { name: c.name, teacher: c.teacher, grade: c.grade, total: roster.length, full: 0, white: 0, choc: 0, pct: '', status: 'Not Submitted' };
      }
      let full=0, white=0, choc=0;
      Object.values(log.entries).forEach(e => { if (e.fullPortion) full++; if (e.milk==='white') white++; if (e.milk==='chocolate') choc++; });
      const pct = roster.length > 0 ? Math.round((full/roster.length)*1000)/10 : 0;
      return { name: c.name, teacher: c.teacher, grade: c.grade, total: roster.length, full, white, choc, pct: pct + '%', status: 'Submitted' };
    });
  }, [data, dateVal]);

  function downloadCsv() {
    const header = ['Classroom','Teacher','Grade','Total Students','Full Portions','White Milk','Chocolate Milk','Participation %','Status'];
    const lines = [header.join(',')];
    rows.forEach(r => {
      lines.push([r.name, r.teacher, r.grade, r.total, r.full, r.white, r.choc, r.pct, r.status].map(v => '"' + String(v).replace(/"/g,'""') + '"').join(','));
    });
    const csv = lines.join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'lunch-totals-' + dateVal + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  return (
    <div>
      <h3 className="text-xl font-bold text-primary-900 mb-4">Export Daily Totals</h3>
      <div className="flex items-center gap-3 mb-6 flex-wrap">
        <input type="date" value={dateVal} onChange={e => setDateVal(e.target.value)} className="border-2 border-primary-200 rounded-xl px-3 py-2" />
        <PrimaryButton onClick={downloadCsv}>Download CSV</PrimaryButton>
      </div>
      <div className="bg-white rounded-2xl card-shadow border border-primary-100 overflow-x-auto">
        <table className="w-full text-sm">
          <thead>
            <tr className="bg-primary-50 text-primary-700 text-left">
              <th className="p-3 font-semibold">Classroom</th>
              <th className="p-3 font-semibold">Teacher</th>
              <th className="p-3 font-semibold text-right">Total</th>
              <th className="p-3 font-semibold text-right">Full Portions</th>
              <th className="p-3 font-semibold text-right">White Milk</th>
              <th className="p-3 font-semibold text-right">Choc. Milk</th>
              <th className="p-3 font-semibold text-right">Participation</th>
              <th className="p-3 font-semibold text-right">Status</th>
            </tr>
          </thead>
          <tbody className="divide-y divide-primary-50">
            {rows.map(r => (
              <tr key={r.name}>
                <td className="p-3 font-medium text-primary-900">{r.name}</td>
                <td className="p-3 text-primary-600">{r.teacher}</td>
                <td className="p-3 text-right">{r.total}</td>
                <td className="p-3 text-right">{r.full}</td>
                <td className="p-3 text-right">{r.white}</td>
                <td className="p-3 text-right">{r.choc}</td>
                <td className="p-3 text-right">{r.pct}</td>
                <td className="p-3 text-right">
                  <span className={"text-xs font-semibold px-2 py-1 rounded-full " + (r.status === 'Submitted' ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500')}>{r.status}</span>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

      )}

      {role === 'admin' && (
        <AdminPanel data={data} persist={persist} onResetData={resetData} />
      )}

      <footer className="text-center text-xs font-light text-primary-400 py-8">
        Lunch Tracker Prototype &middot; Built for demonstration purposes
      </footer>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
